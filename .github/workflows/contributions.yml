name: Update contribution animations

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate light and dark animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/update_profile_charts.py
      - name: Commit updated animations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions-snake.svg assets/contributions-snake-dark.svg assets/contributions-mobile.svg assets/contributions-mobile-dark.svg assets/contributions-mobile-adaptive.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update contribution animations'
            git pull --rebase
            git push
          fi
